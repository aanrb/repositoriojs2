<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
  <title>Repositorio JSII</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Repositorio Jurisdiccional</h1>
    <table class="table table-striped align-middle" id="repoTable">
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Nombre</th>
          <th>Fecha</th>
          <th>Tamaño</th>
          <th>Ver</th>
          <th>Descargar</th>
        </tr>
      </thead>
      <tbody id="repoBody"></tbody>
    </table>
  </div>

  <script>
    async function loadRepo() {
      const response = await fetch('data.json');
      const data = await response.json();
      const tbody = document.getElementById('repoBody');

      data.folders.forEach(folder => {
        // Carpeta
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><i class="fa fa-folder"></i></td>
          <td>${folder.name}</td>
          <td>${folder.date}</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
        `;
        tbody.appendChild(tr);

        // Archivos dentro de la carpeta
        folder.items.forEach(file => {
          const trFile = document.createElement('tr');
          trFile.innerHTML = `
            <td><i class="fa fa-file"></i></td>
            <td>${file.name}</td>
            <td>${file.date}</td>
            <td>${file.size}</td>
            <td><a href="${file.path}" target="_blank"><i class="fa fa-eye"></i></a></td>
            <td><a href="${file.path}" download><i class="fa fa-download"></i></a></td>
          `;
          tbody.appendChild(trFile);
        });
      });
    }

    loadRepo();
  </script>
</body>
</html>
